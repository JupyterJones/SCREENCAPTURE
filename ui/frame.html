<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      pointer-events: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    .guide-border {
      width: 100%;
      height: 100%;
      border: 2px dashed #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6), inset 0 0 8px rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="guide-border"></div>
</body>
</html>
